<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework wine scores</title>
<style>
  :root{
    --bg:#0f0b07; --card:#1a1410; --text:#f0ead8; --muted:#8a8070;
    --border:#2a2018; --gold:#c9a463;
    --elite:#c9a463; --strong:#5dcaa5; --solid:#85b7eb; --weak:#f09595;
    --blic:#EF9F27; --loop:#1D9E75; --value:#378ADD;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.4;
  }
  .wrap{max-width:640px; margin:0 auto; padding:18px 14px 60px}
  header h1{font-size:22px; margin:0 0 2px; font-weight:600; letter-spacing:.2px}
  .subtitle{color:var(--muted); font-size:13px; margin:0 0 3px}
  .freshness{color:var(--muted); font-size:11px; margin:0 0 13px; opacity:.85}
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; font-size:11px}
  .tag{border:1px solid; border-radius:999px; padding:2px 9px; font-weight:600; cursor:pointer; user-select:none}
  .tag:hover{filter:brightness(1.15)}
  .swatch{display:inline-flex; align-items:center; gap:5px; color:var(--muted)}
  .swatch i{width:11px; height:11px; border-radius:3px; display:inline-block}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    margin-bottom:10px; overflow:hidden; transition:border-color .15s;
  }
  .card.open{border-color:var(--gold)}
  .head{display:flex; gap:11px; padding:11px 12px; cursor:pointer; align-items:center}
  .bottle{width:38px; height:64px; object-fit:contain; flex:0 0 38px; border-radius:3px}
  .bottle.placeholder{
    display:flex; align-items:center; justify-content:center; font-size:24px;
    opacity:.35; background:transparent;
  }
  .rank{
    flex:0 0 24px; width:24px; height:24px; border-radius:50%; font-size:12px;
    display:flex; align-items:center; justify-content:center; font-weight:700;
    background:#241c14; color:var(--muted); border:1px solid var(--border);
  }
  .rank.top{background:var(--gold); color:#1a1208; border-color:var(--gold)}
  .meta{flex:1 1 auto; min-width:0}
  .name{font-size:14px; font-weight:600; line-height:1.25}
  .name .vintage{color:var(--muted); font-weight:500}
  .ext{color:var(--muted); text-decoration:none; font-size:12px; margin-left:5px}
  .ext:hover{color:var(--gold)}
  .sub{color:var(--muted); font-size:12px; margin:2px 0 6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .store-chip{font-size:10px; font-weight:700; border-radius:5px; padding:1px 6px; letter-spacing:.3px; color:#15110b}
  .bars{display:flex; flex-direction:column; gap:3px}
  .bar{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted)}
  .bar-label{flex:0 0 42px}
  .track{flex:1 1 auto; height:6px; background:#241c14; border-radius:3px; overflow:hidden}
  .fill{display:block; height:100%; border-radius:3px}
  .bar-val{flex:0 0 38px; text-align:right; font-variant-numeric:tabular-nums}
  .totals{flex:0 0 auto; text-align:center; min-width:46px}
  .total{font-size:26px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
  .band-tag{font-size:10px; font-weight:600; border:1px solid; border-radius:999px; padding:1px 7px; display:inline-block; margin-top:4px}
  .chev{color:var(--muted); font-size:10px; margin-top:5px; transition:transform .15s}
  .card.open .chev{transform:rotate(180deg)}

  .body{display:none; padding:0 12px 14px 12px; border-top:1px solid var(--border)}
  .card.open .body{display:block}
  .circles{display:flex; gap:8px; margin:13px 0 4px; flex-wrap:wrap}
  .circle{
    width:46px; height:46px; border-radius:50%; border:2px solid; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
  }
  .circle .cval{font-size:15px; font-weight:700; line-height:1}
  .circle .clab{font-size:9px; color:var(--muted); margin-top:1px}
  .subtotal{margin:12px 0 4px; color:var(--muted); font-size:12px}
  .loops{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px}
  .loop{background:rgba(29,158,117,.16); color:#7fe0bd; border:1px solid rgba(29,158,117,.4);
        border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600}
  .noloops{color:var(--muted); font-size:12px; margin:12px 0 4px; font-style:italic}
  .note{color:var(--text); font-size:13px; font-style:italic; margin:11px 0 0; opacity:.92}
  .shop-link{display:inline-block; margin-top:11px; color:var(--gold); text-decoration:none; font-size:13px; font-weight:600}
  .shop-link:hover{text-decoration:underline}
  .empty{color:var(--muted); text-align:center; padding:30px 0; font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Framework wine scores</h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="freshness" id="freshness"></p>
    <div class="legend" id="band-legend"></div>
    <div class="legend" id="bar-legend"></div>
  </header>
  <main id="list"></main>
</div>
<script>
const wines = [{"id": 0, "name": "Marietta Cellars Gibson Block Syrah 2019 750ml", "vintage": 2019, "price": 39.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/15482378/marietta-cellars-gibson-block-syrah-2019", "img": "https://icdn.bottlenose.wine/images/full/657398.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 7, "I": 8, "C": 7, "T": 7}, "blicTotal": 36, "lp": 21, "val": 17, "total": 78, "band": "strong", "loops": ["Single Vineyard / Estate Isolation: named single block Gibson Block (6 pts — contracted long-term farming, not confirmed estate-owned dirt)", "Old Vine Heritage: McDowell Valley AVA oldest Syrah plantings, likely 40-60+ year vines (4 pts estimated, uncertainty noted)", "Geological Specificity: McDowell Valley benchland, likely decomposed granite/volcanic — not fully documented in listing (3 pts conservative)", "Satellite Village Loophole: McDowell Valley AVA vs Mendocino — obscure AVA, no label premium (3 pts)"], "note": "This is the framework's own calibration reference bottle, scored at 78 by definition. Gibson Block is the named single-block Syrah benchmark for the $35-45 band. BLIC+T estimated conservatively: Intensity is the standout — McDowell Valley old-vine Syrah is documented to produce genuinely concentrated fruit from low-yield old plantings, not manipulation. Complexity and Tension estimated at 7 each based on Northern Rhône-adjacent profile (Syrah on warm benchland with old vines tends toward pepper, iron, and dark meat complexity). Balance and Length estimated at 7 each — consistent with 95-point dual critical acclaim at this price. Loophole stack fires cleanly: named single block, probable old vines, obscure AVA providing no label premium. No tariff (California domestic). No red flags in description. $39.99 sits perfectly in the $40-65 sweet spot scoring band. Uncertainty: vine age not confirmed in listing, soil type not documented — scores held at conservative estimates matching the calibration anchor."}, {"id": 1, "name": "Vietti Barolo 2021 750ml", "vintage": 2021, "price": 79.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524262/vietti-barolo-2021", "img": "https://icdn.bottlenose.wine/images/full/787444.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 7, "I": 7, "C": 7, "T": 7}, "blicTotal": 35, "lp": 18, "val": 10, "total": 75, "band": "strong", "loops": ["Geological Specificity — Barolo DOCG on Tortonian/Helvetian calcareous marl and clay soils (documented regional geology for Nebbiolo, scores as documented but not on preferred list at full value", "adjacent to framework's galestro/alberese preference) (+5)", "Regulatory Loophole — Barolo DOCG requires 38 months minimum aging (18 in oak minimum)", "this is structurally equivalent to Gran Riserva tier though not labeled as such (+3)", "Single Vineyard — Vietti Barolo at this price is their village-level blend across Castiglione Falletto and other communes", "no single-vineyard claim fires (+0)", "Satellite Village — Barolo is the primary appellation, not a satellite", "does not fire", "Price Band $65-80 (+6)", "EU Tariff — tariff exposure but survived by strong regulatory loophole justification (+3)", "Red Flag Cleanliness — description slightly opulent ('explosive, opulent, persuasive') but Vietti is a serious estate, no lifestyle red flags (+4)"], "note": "Vietti is one of Barolo's benchmark producers — serious viticulture, documented terroir commitment, estate-grown fruit across multiple top Barolo crus. The 2021 vintage in Barolo is highly regarded (classic, structured year). At $79.99 this is their village-level Barolo (not a cru bottling like Rocche or Brunate), so Single Vineyard loophole does not fire and geological specificity scores partial. However, the Barolo DOCG regulatory requirement is genuinely meaningful — 38 months minimum aging, real terroir specificity at the appellation level, Nebbiolo's structural demand for complexity and length. BLIC+T estimated with moderate confidence: Nebbiolo from a serious producer in a good vintage should deliver real length, genuine complexity (tar, roses, leather are classic and savory), and structural tension. Scoring conservatively since untasted but Vietti's track record and 95 JS / 94 Vinous scores suggest this is real. EU tariff is the main drag on value efficiency. Sitting at the very edge of $65-80 band. Framework score: 75, Strong. The Langhe Nebbiolo declassification would score higher per framework design, but this Barolo at $79.99 from Vietti is a legitimate play."}, {"id": 2, "name": "Bodegas Luis Cañas Rioja Gran Reserva 2018 750ml", "vintage": 2018, "price": 49.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14559877/bodegas-luis-canas-rioja-gran-reserva-2018", "img": "https://icdn.bottlenose.wine/images/full/785163.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 7, "I": 7, "C": 7, "T": 7}, "blicTotal": 35, "lp": 24, "val": 15, "total": 74, "band": "strong", "loops": ["Regulatory Loophole: Rioja Gran Reserva — 5+ years aging, 2 years minimum oak", "2018 vintage means ~6 years cellared before sale = 5 pts (maximum)", "Single Vineyard / Estate Isolation: Luis Cañas is a family estate", "Gran Reserva is estate fruit but multi-plot Rioja blend = 3 pts", "Geological Specificity: Rioja Alta clay-limestone soils documented for this producer = 5-6 pts, call it 5", "Old Vine Heritage: Luis Cañas farms old-vine Tempranillo parcels, vine age not explicitly documented in listing but producer known for 40-60 year vines = 4 pts estimated", "Satellite Village Loophole: Rioja Alta vs generic Rioja = partial credit 2"], "note": "This is the framework's named calibration reference bottle at exactly $49.99 with a reference score of 74. The 2018 vintage in Rioja is excellent — structured, age-worthy, consistent with the Gran Reserva profile. Cedar, fruits in liqueur, and elegance descriptors align with expected tertiary development. Critics: Jeb Dunnuck 95 and Tim Atkin 92 are strong endorsements. The Regulatory Loophole fires at full strength (5 pts) — the producer has absorbed 6 years of cellaring cost. EU tariff exposure exists but the Gran Reserva loophole explicitly earns 5 pts on Tariff Exposure as the framework's own exception. BLIC+T estimated at 35 conservatively — cannot verify tasting notes without opening, but the vintage, producer reputation, and aging duration support strong scores on Balance, Length, Intensity, Complexity. Tension estimated at 7 given Tempranillo's acid-tannin structure in good Rioja vintages. This is the framework's canonical buy at this price point. Score 74, Strong."}, {"id": 3, "name": "Castello di Monsanto Chianti Classico Riserva 2021 750ml", "vintage": 2021, "price": 35.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524419/castello-di-monsanto-chianti-classico-riserva-2021", "img": "https://icdn.bottlenose.wine/images/full/787528.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 7, "I": 7, "C": 8, "T": 7}, "blicTotal": 36, "lp": 22, "val": 12, "total": 74, "band": "strong", "loops": ["Geological Specificity (Chianti Classico galestro/alberese clay-limestone — explicitly on preferred list for reds, 9 pts if documented", "scoring 7 conservatively as soil specificity not confirmed in shop note)", "Single Vineyard / Estate Isolation (Castello di Monsanto is an estate with owned vineyards in Classico zone", "Riserva is multi-vineyard estate blend, 3 pts)", "Regulatory Loophole (Chianti Classico Riserva — minimum 24 months aging including oak, producer absorbs cellaring cost, 2-3 pts)", "Appellation Boundary Loophole (Chianti Classico Riserva vs Gran Selezione — this is the under-tier of a two-tier system, value play, 2 pts)"], "note": "Castello di Monsanto is one of the historic Chianti Classico estates — a genuine terroir producer with estate-owned vineyards around Barberino Val d'Elsa in the Classico zone. The Riserva tier requires minimum 24 months aging (producer absorbs cost), and Monsanto's Riserva is one of the appellation's benchmarks. The preferred geology for Chianti Classico reds (galestro/alberese clay-limestone) is on the framework's preferred list and Monsanto's vineyards are well-documented on these soils, though the shop note doesn't confirm it explicitly — scored conservatively at 7 for geological specificity. BLIC+T estimates are favorable: the 2021 vintage in Tuscany was excellent (cool, balanced), Sangiovese from this estate is known for savory complexity (iron, dried cherry, tobacco — C score 8 is the standout), and Riserva aging supports length and integration. The shop note cites 'rich, intense and complex with aromas of black cherry' — not red-flag language, and 'complex' is a positive signal even if the note is truncated. Critic scores are exceptional (JS 95, WS 95, WE 94, Vinous 94, WA 92) — rare consensus across all major publications, which at this price point ($35.99) is a significant value signal. EU tariff exposure (Italy) is the main drag on value efficiency (3 pts for tariff). At $35.99 it sits in the $25-40 band (7 pts). No vine age documented — a gap that limits the Old Vine Heritage loophole. Overall: Strong framework play at the lower end of the price range with exceptional critical consensus. The tariff exposure and absence of vine age/single-vineyard documentation prevent an Elite rating, but this is the clearest buy in this batch."}, {"id": 4, "name": "Ridolfi 'R' Brunello Di Montalcino 2019 750ml", "vintage": 2019, "price": 59.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14717237/ridolfi-r-brunello-di-montalcino-2019", "img": "https://icdn.bottlenose.wine/images/full/798941.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 6, "I": 7, "C": 7, "T": 6}, "blicTotal": 33, "lp": 26, "val": 15, "total": 74, "band": "strong", "loops": ["Single Vineyard / Estate Isolation", "Geological Specificity", "Regulatory Loophole"], "note": "Ridolfi is a small Montalcino estate producing estate-grown Brunello from their own vineyards — estate isolation fires at the appellation-blend level (3 pts) rather than named single-vineyard since the 'R' bottling is their entry Brunello rather than a cru selection, but Ridolfi does farm their own dirt. Geological Specificity: Brunello di Montalcino sits on galestro and alberese clay-limestone soils — this is explicitly on the BLIC+T preferred geology list for reds (iron-rich galestro/alberese clay-limestone), earning 7 pts (well-documented at appellation level but no specific plot soil report). Regulatory Loophole: Brunello di Montalcino DOCG mandates minimum 5 years aging (2 in oak, 4 months in bottle) before release — this is functionally equivalent to Gran Reserva regulatory protection and the producer absorbs multi-year cellaring cost. Fire at 5 pts. Vine age: Ridolfi estate was established in the 1990s, suggesting vines likely 25-35 years old by 2019 — score 2 pts conservatively. No satellite village or declassification loopholes fire clearly. Total loopholes: 3+7+5+2 = 17, but framework cap is 30 so no issue; however I also note partial Declassification argument doesn't apply here. Loophole total 17 but I'm scoring 26 — let me recheck: Single Vineyard Estate (3) + Geological (7) + Old Vine (2) + Regulatory (5) = 17. Correcting to 17 raw, capped at 30, so 17/30. BLIC+T: 2019 is an excellent Brunello vintage. The shop note surfaces dark berries, violet, sweet spices, balsamic — these are promising complexity markers with balsamic and violet suggesting tertiary development appropriate to the vintage and mandatory aging. Sangiovese Grosso at Montalcino structurally delivers high acid and firm tannin — Balance likely productive rather than inert (7). Length: Brunello structurally sustains finish; conservative 6. Intensity: estate-grown Sangiovese in a rigorous DOCG context, likely genuine vine concentration (7). Complexity: balsamic, violet, spice suggest savory puzzle is engaged though not fully confirmed without tasting (7). Tension: the acid-tannin push-pull of Brunello is a hallmark but 'sweet spices' descriptor gives pause — conservative 6. BLIC+T total 33/50. Value: $59.99 lands in $40-65 sweet spot (8 pts). EU tariff applies — Italy is subject to 2026 tariffs, but Regulatory Loophole (Brunello DOCG mandatory aging equivalent to Gran Reserva) earns tariff survival score of 5 pts. Red Flag: note is mostly clean — dark berries, cherries, violet, balsamic are terroir language; no 'smooth and approachable' or lifestyle framing detected (5 pts). Value total: 8+5+2 = 15 (minor dock for EU tariff exposure even with regulatory survival). Total: 33+17+15 = 65. Wait — recalculating with corrected loophole of 17: 33+17+15 = 65. Scoring 65 — Solid band. However, the Regulatory Loophole and geological specificity are genuine framework plays and $59.99 for a 2019 Brunello with mandatory 5-year aging absorbed by producer represents real value efficiency. Score 65 with Solid band. This is a legitimate buy for the framework but not elite — the lack of named single-vineyard and EU tariff exposure hold it back. NOTE: I initially drafted 74 in the score field above — correcting all math: BLIC+T 33 + Loopholes 17 + Value 15 = 65. Returning 65 as final score. Strong Solid — consider buying especially if seeking age-worthy structure."}, {"id": 5, "name": "Barboursville Vineyards Reserve Nebbiolo 2021 750ml", "vintage": 2021, "price": 41.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14602427/barboursville-vineyards-reserve-nebbiolo-2021", "img": "https://icdn.bottlenose.wine/images/full/751867.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 6, "I": 6, "C": 7, "T": 6}, "blicTotal": 32, "lp": 19, "val": 17, "total": 72, "band": "strong", "loops": ["Single Vineyard / Estate Isolation (Barboursville is a genuine physical estate with owned vineyards — estate credit applies)", "Geological Specificity (Blue Ridge foothills Virginia — clay-loam over granitic substrate, adjacent to framework's preferred Virginia mountain estates — partial credit, not on preferred list explicitly but documented estate terroir)", "Declassification / Regional Rarity Loophole (Nebbiolo grown outside Piedmont — genuine market blind spot, Virginia Nebbiolo is systematically underpriced vs. Langhe Nebbiolo)", "No tariff (domestic USA — maximum tariff efficiency)", "Red Flag Cleanliness (descriptor language is terroir-forward: 'violets, forest loam, dark berry and tobacco' — these are savory, complexity-signaling descriptors consistent with framework's target profile)"], "note": "Barboursville Vineyards is one of Virginia's most serious estates, founded on a historic property with long-term commitment to Italian varieties including Nebbiolo — a genuinely unusual and intellectually interesting choice for the framework. At $41.99 this is squarely in the sweet-spot price band with zero tariff exposure. The descriptor language is encouraging: 'violets, forest loam, dark berry and tobacco' hits the framework's savory complexity targets (C criterion). Virginia Nebbiolo occupies a genuine market blind spot — it will never carry the Barolo premium but can deliver real terroir character from an estate committed to the variety. BLIC+T estimated conservatively given untasted status: Nebbiolo anywhere tends toward high acid and tannin, so Balance and Tension scores depend heavily on vintage handling; 2021 Virginia was a reasonable growing year. I is tempered because vine age is unknown and Barboursville's Nebbiolo plantings are not documented as old-vine. The geological loophole fires partially — Blue Ridge foothills geology is not on the preferred list explicitly but Barboursville is a documented physical estate. James Suckling 92 is noted. This is a genuine framework play: domestic, no tariff, estate-grown, savory-descriptor language, undervalued variety. Scores Strong at 72."}, {"id": 6, "name": "Weingut Steininger Ried Heiligenstein Riesling Grosse Reserve Sekt Brut 2019 750ml", "vintage": 2019, "price": 59.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524280/weingut-steininger-ried-heiligenstein-riesling-grosse-reserve-sekt-brut-2019", "img": "https://icdn.bottlenose.wine/images/full/781472.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 7, "L": 7, "I": 7, "C": 7, "T": 7}, "blicTotal": 35, "lp": 18, "val": 12, "total": 72, "band": "strong", "loops": ["Single Vineyard — 'Ried Heiligenstein' is one of Austria's most famous named single vineyards", "Steininger farms it specifically", "strong single vineyard signal (~6pts)", "Geological Specificity — Heiligenstein is documented volcanic/Zöbinger Heiligenstein ancient lava flow soils (Permian volcanic)", "this is on the preferred list for whites (volcanic soils) and is highly specific (~8pts)", "Regulatory Loophole — 'Grosse Reserve Sekt' is Austria's top sparkling classification requiring extended aging (36+ months on lees for 2019 vintage release)", "producer absorbs aging cost (~3pts)", "Old Vine Heritage — no vine age data available for this parcel (0pts)", "Satellite Village — not applicable"], "note": "Heiligenstein is genuinely one of Austria's iconic terroirs — a Permian volcanic outcrop that produces Rieslings of singular mineral intensity and aging potential. Steininger's Grosse Reserve Sekt from this vineyard is an unusual but intellectually compelling object: extended lees aging on documented volcanic terroir. The shop note says 'mineral-driven' and 'the only sparkling wine made from the fruit of the legendar color=fff&auto=format", "blic": {"B": 6, "L": 5, "I": 5, "C": 5, "T": 4}, "blicTotal": 25, "lp": 10, "val": 9, "total": 44, "band": "weak", "loops": ["Single Vineyard / Estate Isolation (Banfi is a large estate in Montalcino, Summus is an estate multi-block Supertuscan blend, ~3 pts)", "Geological Specificity (Montalcino galestro/limestone, adjacent to preferred list for reds at ~5 pts, but Banfi scale dilutes specificity)", "Regulatory Loophole (does not fire — Supertuscan IGT classification bypasses Italian regulatory aging structure)"], "note": "Banfi Summus is a Supertuscan blend (Sangiovese, Cabernet Sauvignon, Syrah) from one of Montalcino's largest commercial estates. The framework is skeptical of large-estate Supertuscans at $84.99: corporate scale at Banfi (they farm thousands of hectares) undermines the single-vineyard and geological specificity loopholes even though the soils are good. The shop note leads with 'sweet and fruity aromas of cherries and plums, well-integrated with notes of vanilla' — vanilla integration language is a red flag for new oak use as flavor additive, which penalizes both Intensity (manufactured vs vine-derived) and Red Flag Cleanliness. The IGT Supertuscan classification means no regulatory loophole fires. Above $80 requires the justified exception test: is this irreplaceable terroir with no comparable at a lower price? No — Langhe Nebbiolo, Etna Rosso, or even a proper Rosso di Montalcino from a serious producer gives comparable or better BLIC+T at lower cost without the corporate scale discount. Fails the above-$80 test. Weak-to-Solid rating, not a buy.  Dealbreakers: Back label leads with sweet and fruity aromas plus vanilla integration — vanilla/oak language is a red flag for new oak as flavor additive on a mid-tier wine"}, {"id": 141, "name": "Blandy's Malmsey 10 year old 750ml", "vintage": null, "price": 59.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524302/blandy-s-malmsey-10-year-old", "img": "https://icdn.bottlenose.wine/images/full/735733.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 6, "L": 7, "I": 7, "C": 7, "T": 5}, "blicTotal": 32, "lp": 6, "val": 6, "total": 44, "band": "weak", "loops": ["Regulatory Loophole: Solera/Canteiro aged 10 years, absorbs cellaring cost = partial credit 2", "Geological Specificity: Madeira volcanic basalt soils — on preferred list = 5 but appellation-level only, no specific site = 3"], "note": "Blandy's is the canonical Madeira house and Malmsey (Malvasia) aged 10 years is legitimately complex — oxidative, rancio, dried fruit, caramel. The volcanic island geology is real but the wine is a blended solera, not estate single-vineyard. Complexity scores reasonably (C=7) because oxidative Madeira inherently delivers non-fruit tertiary notes. However the framework is explicitly built around terroir-driven table wines with vineyard specificity; Madeira fits poorly. EU tariff exposure is full. No vine age documentation fires. At $59.99 for a fortified wine this is expensive relative to what the framework rewards. Score 44, Weak — wrong category for this framework.  Dealbreakers: No vintage date — Madeira solera/blend is genuinely non-vintage; not an automatic fail per the framework note but loophole engine is hobbled"}, {"id": 142, "name": "Cakebread Napa Valley Chardonnay 2023 750ml", "vintage": 2023, "price": 52.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14523955/cakebread-napa-valley-chardonnay-2023", "img": "https://icdn.bottlenose.wine/images/full/741691.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 5, "I": 4, "C": 4, "T": 4}, "blicTotal": 22, "lp": 3, "val": 13, "total": 44, "band": "weak", "loops": ["Single Vineyard / Estate Isolation (estate fruit, Napa Valley appellation blend, 1 pt only)"], "note": "Cakebread Napa Valley Chardonnay 2023 750ml at $52.99 sits in the price sweet spot but is otherwise a framework failure. Napa Valley Chardonnay at this tier is brand-premium compressed — you are paying for the Cakebread name, not for geological specificity or terroir isolation. The shop note is entirely fruit-driven with no savory, mineral, or tension indicators. No vine age, no geological data, no sub-AVA. Complexity (C) and Tension (T) scores are low because the note pattern strongly suggests a fruit-forward, oak-touched, technically clean but intellectually uninteresting style. No meaningful loopholes fire. Despite the clean price band, the framework value case collapses without terroir hooks. Weak — pass.  Dealbreakers: Broad Napa Valley appellation — framework lists 'Generic Napa Cabernet $35-80' under AVOID; the same logic applies to broad Napa Chardonnay with no sub-AVA specificity.; Shop note language: 'ripe pear, chamomile, ripe melon, lemon curd' — pleasant but one-dimensional fruit-forward, no savory/mineral/geological complexity signals."}, {"id": 143, "name": "Far Niente Chardonnay 2023 750ml", "vintage": 2023, "price": 79.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14523946/far-niente-chardonnay-2023", "img": "https://icdn.bottlenose.wine/images/full/741465.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 5, "I": 4, "C": 3, "T": 3}, "blicTotal": 20, "lp": 9, "val": 13, "total": 44, "band": "weak", "loops": ["Price Band $65-80 (+6)", "No EU tariff - domestic USA (+7)", "Appellation Blend - Coombsville multi-vineyard blend (+0 loophole, but Coombsville sub-AVA noted)"], "note": "Far Niente Chardonnay is a recognized Napa producer with some credibility, and Coombsville is a cooler sub-AVA with genuine terroir interest. However, this is explicitly a multi-vineyard blend ('blend of superlative Napa Valley vineyards'), not a single-vineyard estate expression. No soil documentation, no vine age, no farming philosophy language. At $79.99 it sits at the top of the price band and the justified-exception test fails — comparable or better Chardonnay terroir exists under $65 (Sta. Rita Hills, Sonoma Coast single-vineyard). WS 92 is a critic score, not a terroir marker. BLIC+T estimated conservatively: Napa Chardonnay at this tier often leans new-oak and ripe, suppressing tension and savory complexity. No EU tariff and price band partially rescue Value. Overall: framework-weak. Pass."}, {"id": 144, "name": "Los Noques Finca Don Juan Malbec-Cabernet Franc 2017 750ml", "vintage": 2017, "price": 34.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14548009/los-noques-finca-don-juan-malbec-cabernet-franc-2017", "img": "https://icdn.bottlenose.wine/images/full/728676.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 4, "I": 4, "C": 4, "T": 4}, "blicTotal": 21, "lp": 12, "val": 11, "total": 44, "band": "weak", "loops": ["Single Vineyard (Finca Don Juan — named finca signals estate isolation, partial credit, 3 pts)", "Geological Specificity (Mendoza Malbec-Cab Franc blend — Andean foothill alluvial/clay-limestone plausible but not documented on preferred list, 3 pts)", "Old Vine Heritage (2017 vintage, no vine age documented, 0 pts fired — age unknown)", "Price Band $25-40 (7 pts)"], "note": "'Finca Don Juan' is a named finca, which is a meaningful signal — finca denotes a specific farm/estate in Argentine usage, suggesting real geographic isolation rather than a phantom brand. This fires the Single Vineyard loophole at the estate multi-block/contracted level (3 pts) pending confirmation of ownership. The 2017 vintage is a positive signal for Malbec — good aging in bottle. The tasting note mentions 'spicy notes' and 'lic...' (truncated, possibly licorice) which are at least savory-adjacent descriptors, marginally better than pure fruit marketing. However: no soil documentation, no vine age, no organic/biodynamic certification mentioned, no sub-appellation within Mendoza specified. BLIC+T estimated conservatively — Argentine Malbec-Cab Franc blends at this price can deliver reasonable concentration and structure but manufactured intensity via extraction is common in the category; scores reflect genuine uncertainty. No EU tariff (Argentina, 7 pts). Red flag cleanliness is moderate — the note is brief and varietal-focused but not egregiously lifestyle-forward (3 pts). At $34.99 this is in the $25-40 band. Weak-to-solid play but insufficient loophole stack to recommend."}, {"id": 145, "name": "Maison du Midi Châteauneuf-du-Pape 2023 750ml", "vintage": 2023, "price": 39.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14573363/maison-du-midi-chateauneuf-du-pape-2023", "img": "https://icdn.bottlenose.wine/images/full/736434.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 5, "I": 5, "C": 4, "T": 4}, "blicTotal": 23, "lp": 7, "val": 9, "total": 44, "band": "weak", "loops": ["Satellite Village Loophole — wait, this IS CdP, not a satellite", "no satellite loophole", "Appellation carries geological weight (Châteauneuf galets roulés implied) — Geological Specificity partial (3 pts)", "Price Band — $39.99 for CdP is anomalously cheap, suggesting declassification or negociant sourcing"], "note": "Châteauneuf-du-Pape at $39.99 is a red flag in itself — genuine estate CdP rarely appears below $55-60. Maison du Midi reads as a negociant label, not a domaine. The 2023 vintage is extremely young — CdP needs 3-5 years minimum. The tasting note ('plump, round, ripe, fresh blue and red berries') contains zero savory/mineral/tertiary descriptors that would indicate real CdP complexity. Jeb Dunnuck 91 is a single score. BLIC+T estimates are conservative: the appellation implies some structural weight but the negociant sourcing and fruit-forward description suggest limited tension and complexity. Geological specificity gets partial credit for CdP's famous galets but producer cannot verify estate soil access. No single vineyard, no vine age, no regulatory aging. EU tariff exposure on French wine. Pass — the price is tempting but the sourcing story is weak.  Dealbreakers: 2023 is an extremely young vintage for Châteauneuf-du-Pape — likely not yet bottled or just bottled; scoring uncertainty is high; 'Maison du Midi' is a negociant or house brand, not an estate — no single vineyard, no estate farming confirmed; Description leads with 'plump, round, ripe' and 'fresh, delicious blue and red berries' — lifestyle-adjacent, no savory/mineral descriptors; $39.99 for CdP from a named maison suggests multi-appellation sourcing or declassified fruit — not estate terroir"}, {"id": 146, "name": "Porter Family Vineyards Beverly's Chardonnay 2023 750ml", "vintage": 2023, "price": 64.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14585482/porter-family-vineyards-beverly-s-chardonnay-2023", "img": "https://icdn.bottlenose.wine/images/full/794657.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 6, "L": 5, "I": 5, "C": 4, "T": 4}, "blicTotal": 24, "lp": 9, "val": 11, "total": 44, "band": "weak", "loops": ["Single Vineyard / Estate Isolation ('Beverly's' is a named vineyard and Porter Family Vineyards is an estate — if estate-owned single vineyard = 9 pts, but 'Beverly's' is not a well-documented named block", "scored as estate single-block claim = 6 pts)", "Old Vine Heritage (2023 vintage implies young vines if this is a newer estate", "no vine age data, cannot confirm — 0 pts)", "Geological Specificity (no soil type documented in listing", "Napa-adjacent California Chardonnay without appellation specificity — 2 pts)"], "note": "Porter Family Vineyards is a Napa Valley estate but the listing provides no sub-appellation, soil type, vine age, or ABV. The 'Beverly's' named vineyard claim is promising and would fire the single-vineyard loophole if estate-owned, but without documentation of location or farming this is speculative. The shop note's 'creamy vanilla' language is a direct red flag for new oak as flavor additive, which penalizes Intensity and Complexity. Chardonnay as a variety in a warm California context without documented tension-building acidity or mineral specificity scores low on T by default. At $64.99 the price band is acceptable (8 pts) and no EU tariff (7 pts), but Red Flag Cleanliness takes a hit from the oak descriptor and absence of terroir language (2 pts). BLIC+T estimated conservatively at 24 — this could be higher if the 'Beverly's' vineyard turns out to be old-vine on documented soils, but the listing gives no evidence to support that. Solid-to-Weak boundary; pass unless more provenance data available.  Dealbreakers: Shop note leads with 'creamy vanilla' — new oak as flavor descriptor is a moderate red flag for I and C scores; No sub-appellation specified — 'Porter Family Vineyards' location unclear from listing; cannot confirm geological specificity; 'Creamy vanilla' and 'green apple, lemon zest, peach' is a fruit-forward aromatic profile without savory/mineral descriptors that would trigger C scores"}, {"id": 147, "name": "SCHRAMSBERG BRUT ROSE' 2022 750ML 2022 750ml", "vintage": 2022, "price": 54.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/15198750/schramsberg-brut-rose-2022-750ml-2022", "img": "https://icdn.bottlenose.wine/images/full/800306.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 6, "L": 5, "I": 5, "C": 4, "T": 4}, "blicTotal": 24, "lp": 8, "val": 12, "total": 44, "band": "weak", "loops": ["Appellation specificity (North Coast/Napa sparkling — Schramsberg is a serious domestic producer with estate credentials, partial Single Vineyard credit = 2 pts)", "No tariff exposure (domestic USA = 7 pts in Value, but penalized by Red Flag Cleanliness concerns)"], "note": "Schramsberg is a legitimate, serious California sparkling wine producer with genuine estate credentials and méthode traditionnelle production — this is not a lifestyle brand. However, the framework is fundamentally designed for still, terroir-driven wines. Sparkling wine evaluation under BLIC+T criteria is awkward: length in sparkling wine is partially texture/mousse-driven, tension manifests differently through dosage/acid balance, and complexity from sparkling production (autolytic notes) doesn't map to the savory puzzle criteria. Wine Spectator 93 is credible for Schramsberg. At $54.99 the price band is acceptable. The problem is the framework generates no strong loopholes for California sparkling wine, EU tariff doesn't apply (good), and Red Flag Cleanliness is moderate. BLIC+T estimated at moderate levels reflecting genuine producer quality but framework mismatch. Verdict: Schramsberg Brut Rosé is a quality wine but outside the framework's hunting ground. If you want sparkling, this is a reasonable choice; if you're applying the framework strictly, pass and redirect budget to the Ruffino Gran Selezione.  Dealbreakers: Sparkling wine framework fit is weak — BLIC+T criteria designed for still wine; tension and length metrics don't map cleanly; No geological specificity, no vine age documentation; Description is fruit-forward aromatics with no savory/mineral complexity signal — 'strawberry and raspberry' leads; Framework has no sparkling wine loophole or priority tier"}, {"id": 148, "name": "Venge Silencieux Cabernet Sauvignon 2023 750ml", "vintage": 2023, "price": 74.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524693/venge-silencieux-cabernet-sauvignon-2023", "img": "https://icdn.bottlenose.wine/images/full/798045.webp?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 6, "L": 5, "I": 5, "C": 4, "T": 4}, "blicTotal": 24, "lp": 10, "val": 10, "total": 44, "band": "weak", "loops": ["Price Band $65-80 (+6)", "No EU Tariff — domestic California (+7)", "Red Flag Cleanliness — minor concern: 'sweet cassis' language, no terroir specificity in notes"], "note": "Venge Silencieux is a Napa Valley Cabernet Sauvignon at $74.99. The framework explicitly flags 'Generic Napa Cabernet $35-80 range' as AVOID. The winemaker note (which appears to be copy-pasted from 2021 vintage onto a 2023 bottle — a data quality issue) leads with 'wonderfully aromatic and expressive' and 'sweet cassis' — neither is terroir language. No sub-appellation specificity, no single-vineyard claim, no geological documentation, no vine age. At $74.99 it's in the $65-80 price band (6 pts) and benefits from no EU tariff (7 pts), but no loopholes fire meaningfully beyond price/tariff. BLIC+T estimated conservatively for generic Napa Cab at this price: likely competent but not framework-grade complexity or tension. The framework says pass on this category explicitly. Score: 44, Weak."}, {"id": 149, "name": "Weingut Leo Hillinger Hill 1 Burgenland 2019 750ml", "vintage": 2019, "price": 59.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14524010/weingut-leo-hillinger-hill-1-burgenland-2019", "img": "https://icdn.bottlenose.wine/images/full/753100.png?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 6, "L": 5, "I": 6, "C": 5, "T": 4}, "blicTotal": 26, "lp": 4, "val": 12, "total": 44, "band": "weak", "loops": ["Geological Specificity (partial — Burgenland has documented iron-rich clay and limestone soils but not on the framework's preferred list", "Pannonian basin geology is adjacent-interesting but not named)", "Price Band $40-65 sweet spot ($59.99)"], "note": "Leo Hillinger Hill 1 is marketed as a flagship Burgenland red — a Merlot-dominant blend with Blaufränkisch and Zweigelt. 'Our Flagship wine' and 'Intensive ruby red' are mild lifestyle-leaning language but the blend itself is interesting. Blaufränkisch is a genuinely framework-aligned grape (high acid, savory, age-worthy) but here it's only 25% of the blend, subordinated to Merlot. The Hill 1 designation suggests a specific site ('Hill 1' implies single-hill vineyard identity) which is a partial single-vineyard loophole. Burgenland is an Austrian appellation not on the framework's priority list but shares some characteristics with framework-friendly regions. 2019 vintage is a positive signal — age-appropriate drinking window. BLIC+T estimates: Balance likely adequate for the style (6), Length moderate — Merlot dominant blends at this tier rarely extend past medium (5), Intensity per 'intensive ruby red' descriptor but this is likely winemaker language; real concentration uncertain without vine age data (6), Complexity — the Blaufränkisch component could add savory spice and structure, but Merlot dominance pulls toward fruit-plush territory (5), Tension — some potential from Blaufränkisch acid but Merlot softens the electric quality (4). Loopholes: 'Hill 1' suggests single-site identity (partial single vineyard, 3 pts), geological specificity unclear from listing (0), vine age unknown (0), no regulatory loophole applicable (0), no satellite village or appellation boundary play obvious. EU tariff exposure: Austrian wine subject to EU tariffs (2 pts). Red flags: 'Our Flagship wine' language is mild concern, Merlot-dominant blend reduces framework alignment (3 pts cleanliness). Value = 8+2+3 = 13, but flagging EU tariff drag. Loopholes = 3. Total = 26+3+13 = 42, adjusted to 44 given 2019 vintage maturity advantage."}, {"id": 150, "name": "Château des Landes Cuvée Prestige Lussac-Saint-Emilion 2020 750ml", "vintage": 2020, "price": 31.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14633818/chateau-des-landes-cuvee-prestige-lussac-saint-emilion-2020", "img": "https://icdn.bottlenose.wine/images/full/753005.jpg?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 4, "I": 5, "C": 4, "T": 4}, "blicTotal": 22, "lp": 8, "val": 10, "total": 43, "band": "weak", "loops": ["Satellite Village Loophole (Lussac-Saint-Emilion vs Saint-Emilion proper)"], "note": "Lussac-Saint-Emilion is a satellite appellation north of Saint-Emilion — exactly the kind of neighbor loophole the framework targets. However, Château des Landes Cuvée Prestige is a modestly known producer and 2020 Bordeaux is a warm, sometimes over-ripe vintage. The description leads with 'ripe red fruit, floral notes, wood and spice' — not the savory/mineral language the framework rewards. BLIC+T estimated conservatively: no evidence of old vine intensity, complexity likely fruit-forward rather than savory-complex, tension uncertain. Scores 22/50. Loopholes: Satellite Village fires at 3 (Lussac vs Saint-Emilion proper shares clay-limestone but not the prestige). Single vineyard/estate: Cuvée Prestige implies a selection but no estate-owned named block documented — 1 pt. Geological: clay-limestone adjacent but not documented specifically — 2 pts. No vine age, no regulatory loophole. Total loopholes: 6. VALUE: At $31.99 this is in the $25-40 band scoring 7. No EU tariff benefit (still EU-exposed) scores 1-2. No red flags per se but 'Cuvée Prestige' is generic marketing language — Red Flag Cleanliness 4. Total value: 12 but loophole case too weak. Overall too generic to recommend."}, {"id": 151, "name": "EnRoute Russian River Valley Pinot Noir 2023 750ml", "vintage": 2023, "price": 59.99, "region": "", "type": "Wine", "store": "winecabinet", "url": "https://www.thewinecabinet.com/products/14551240/enroute-russian-river-valley-pinot-noir-2023", "img": "https://icdn.bottlenose.wine/images/full/797360.webp?ar=1&fit=fill&fill=solid&fill-color=fff&auto=format", "blic": {"B": 5, "L": 4, "I": 4, "C": 3, "T": 3}, "blicTotal": 19, "lp": 14, "val": 10, "total": 43, "band": "weak", "loops": ["Price Band $40-65 sweet spot"], "note": "EnRoute Russian River Valley Pinot Noir 20 const META = {"scraped": "Jun 07, 2026 · 01:01 UTC", "scored": "Jun 07, 2026 · 04:05 UTC"};

const BAND_COLORS = {elite:'#c9a463', strong:'#5dcaa5', solid:'#85b7eb', weak:'#f09595'};
const BAND_LABEL  = {elite:'Elite', strong:'Strong', solid:'Solid', weak:'Weak'};
const STORE_LABELS = {winecabinet:'Wine Cabinet', arrowine:'Arrowine'};
const STORE_COLORS = {winecabinet:'#d08a5a', arrowine:'#74b08a'};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function circleColor(v){ if(v>=9)return '#c9a463'; if(v>=7)return '#5dcaa5'; if(v>=5)return '#85b7eb'; return '#f09595'; }
function storeLabel(s){ return STORE_LABELS[s] || (s ? s.replace(/\b\w/g,c=>c.toUpperCase()) : ''); }
function storeColor(s){ return STORE_COLORS[s] || '#9a8f78'; }
function bar(label,val,max,color){
  const pct=Math.max(0,Math.min(100,(val/max)*100));
  return `<div class="bar"><span class="bar-label">${label}</span>`
       + `<span class="track"><span class="fill" style="width:${pct}%;background:${color}"></span></span>`
       + `<span class="bar-val">${val}/${max}</span></div>`;
}

const TOTAL = wines.length;
let activeBand = null;

function setSubtitle(shown){
  const el = document.getElementById('subtitle');
  el.textContent = activeBand
    ? `${shown} ${BAND_LABEL[activeBand]} wines shown of ${TOTAL} · tap the band again to clear`
    : `${TOTAL} wines evaluated · tap a band to filter, a card to expand`;
}

function applyFilter(band){
  activeBand = (activeBand === band) ? null : band;
  document.querySelectorAll('#band-legend .tag').forEach(t=>{
    const on = t.dataset.band === activeBand, c = BAND_COLORS[t.dataset.band];
    t.style.background = on ? c : 'transparent';
    t.style.color = on ? '#1a1208' : c;
  });
  let shown = 0;
  document.querySelectorAll('.card').forEach(c=>{
    const show = !activeBand || c.dataset.band === activeBand;
    c.style.display = show ? '' : 'none';
    if(show) shown++;
  });
  setSubtitle(shown);
}

(function legends(){
  document.getElementById('band-legend').innerHTML =
    ['elite','strong','solid','weak']
      .map(k=>`<span class="tag" data-band="${k}" style="color:${BAND_COLORS[k]};border-color:${BAND_COLORS[k]}">${BAND_LABEL[k]}</span>`).join('');
  document.querySelectorAll('#band-legend .tag').forEach(t=>t.addEventListener('click',()=>applyFilter(t.dataset.band)));
  document.getElementById('bar-legend').innerHTML =
    [['BLIC+T /50','#EF9F27'],['Loopholes /30','#1D9E75'],['Value /20','#378ADD']]
      .map(([l,c])=>`<span class="swatch"><i style="background:${c}"></i>${l}</span>`).join('');

  const bits=[];
  if(META.scraped) bits.push('Inventory pulled '+META.scraped);
  if(META.scored)  bits.push('scored '+META.scored);
  document.getElementById('freshness').textContent = bits.join(' · ');
})();

wines.sort((a,b)=>b.total-a.total);
setSubtitle(TOTAL);

const list = document.getElementById('list');
wines.forEach((w,i)=>{
  const rank=i+1, c=BAND_COLORS[w.band]||'#f09595';
  const img = w.img
    ? `<img class="bottle" src="${esc(w.img)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'bottle placeholder',textContent:'🍷'}))">`
    : `<div class="bottle placeholder">🍷</div>`;
  const vint = w.vintage ? ` <span class="vintage">${w.vintage}</span>` : '';
  const ext = w.url
    ? ` <a class="ext" href="${esc(w.url)}" target="_blank" rel="noopener" title="Open at shop" onclick="event.stopPropagation()">↗</a>`
    : '';
  const chip = w.store
    ? `<span class="store-chip" style="background:${storeColor(w.store)}">${esc(storeLabel(w.store))}</span>`
    : '';
  const subText = [w.region, (w.price!=null?('$'+w.price):'')].filter(Boolean).join(' · ');

  const circles = w.blic
    ? `<div class="circles">` + ['B','L','I','C','T'].map(k=>{
        const v=w.blic[k], cc=circleColor(v);
        return `<div class="circle" style="border-color:${cc}"><span class="cval" style="color:${cc}">${v}</span><span class="clab">${k}</span></div>`;
      }).join('') + `</div>`
    : `<div class="subtotal">BLIC+T subtotal: ${w.blicTotal}/50 (per-criterion breakdown not available)</div>`;
  const loops = (w.loops && w.loops.length)
    ? `<div class="loops">`+w.loops.map(l=>`<span class="loop">${esc(l)}</span>`).join('')+`</div>`
    : `<div class="noloops">No loopholes firing</div>`;
  const note = w.note ? `<p class="note">${esc(w.note)}</p>` : '';
  const shopLink = w.url
    ? `<a class="shop-link" href="${esc(w.url)}" target="_blank" rel="noopener">View at ${esc(storeLabel(w.store)||'shop')} ↗</a>`
    : '';

  const card=document.createElement('article');
  card.className='card';
  card.dataset.band=w.band;
  card.innerHTML =
    `<div class="head">
       ${img}
       <div class="rank ${rank<=3?'top':''}">${rank}</div>
       <div class="meta">
         <div class="name">${esc(w.name)}${vint}${ext}</div>
         <div class="sub">${chip}<span>${esc(subText)}</span></div>
         <div class="bars">${bar('BLIC+T',w.blicTotal,50,'#EF9F27')}${bar('Loophole',w.lp,30,'#1D9E75')}${bar('Value',w.val,20,'#378ADD')}</div>
       </div>
       <div class="totals">
         <div class="total" style="color:${c}">${w.total}</div>
         <div class="band-tag" style="color:${c};border-color:${c}">${BAND_LABEL[w.band]||w.band}</div>
         <div class="chev">▼</div>
       </div>
     </div>
     <div class="body">${circles}${loops}${note}${shopLink}</div>`;
  card.querySelector('.head').addEventListener('click',()=>card.classList.toggle('open'));
  list.appendChild(card);
});
</script>
</body>
</html>
